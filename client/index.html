<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <!-- Theme bootstrap: runs before first paint so the wrong theme never flashes.
       Keep the key and the admin rule in sync with src/theme/ThemeProvider.jsx -->
  <script>
    (function () {
      try {
        var forceLight = false; // admin is themed; keep in sync with ADMIN_THEMED in ThemeProvider.jsx
        var saved = localStorage.getItem('travelos-theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', forceLight ? 'light' : theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>TravelOS — Premium Kerala &amp; South India Travel</title>
  <meta name="description"
    content="Curated Kerala and South India travel packages by TravelOS, Kochi. Backwaters, hill stations, wildlife, beaches and cultural experiences — crafted for the discerning traveller." />
  <meta property="og:title" content="TravelOS — Premium Kerala &amp; South India Travel" />
  <meta property="og:description"
    content="Handcrafted journeys through Kerala's backwaters, misty hill stations, ancient temples, and pristine beaches." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/images/hero-kerala.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
